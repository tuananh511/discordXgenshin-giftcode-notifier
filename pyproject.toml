[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin-giftcode-notifier"
version = "1.1.0"
description = "Fetch new HoYo gift code and post new ones to a Discord webhook"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
giftcode-notify = "notify_codes:main"

[tool.setuptools]
py-modules = ["notify_codes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E9"]